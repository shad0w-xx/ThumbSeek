name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    env:
      # Exact FFmpeg build, re-hosted as a release asset of this repository so its DLLs never change.
      FFMPEG_URL: https://github.com/${{ github.repository }}/releases/download/ffmpeg-9.0/ffmpeg-n9.0-latest-win64-lgpl-shared-9.0.zip
      FFMPEG_SHA256: 1CA86821F7FD84C99BE0BE3A541BC936E26834CC9DB49355853869C4F8AD3A98
    steps:
      - uses: actions/checkout@v5

      - name: Get FFmpeg (pinned, checksum-verified)
        shell: pwsh
        run: |
          New-Item -ItemType Directory ffmpeg_dl | Out-Null
          Invoke-WebRequest $env:FFMPEG_URL -OutFile ffmpeg_dl/ffmpeg.zip
          if ((Get-FileHash ffmpeg_dl/ffmpeg.zip -Algorithm SHA256).Hash -ne $env:FFMPEG_SHA256) { throw "FFmpeg checksum mismatch" }
          Expand-Archive ffmpeg_dl/ffmpeg.zip -DestinationPath ffmpeg_dl

      - name: Build
        shell: cmd
        run: build.cmd

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory dist | Out-Null
          Copy-Item ThumbSeek.dll, ThumbSeek-setup.exe, avformat-*.dll, avcodec-*.dll, avutil-*.dll, swscale-*.dll, swresample-*.dll, LICENSE, README.md dist/
          Copy-Item "$((Get-ChildItem ffmpeg_dl -Directory)[0].FullName)\LICENSE.txt" dist/FFMPEG-LICENSE.txt

      - uses: actions/upload-artifact@v5
        with:
          name: ThumbSeek
          path: dist/
